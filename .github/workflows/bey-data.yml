name: 戰鬥陀螺查詢資料

on:
  schedule:
    - cron: '17 18 * * 0'   # 每週一 02:17（台灣時間）
  workflow_dispatch:

permissions:
  contents: write   # 要把 docs/bey/data.json 存回倉庫

concurrency:
  group: bey-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: 抓強度、熱門度
        run: python3 bey/fetch_bey.py

      - name: 有變動就存回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/bey/data.json
          if git diff --cached --quiet; then echo "資料沒變"; exit 0; fi
          git commit -m "陀螺查詢資料每週更新"
          git pull --rebase
          git push

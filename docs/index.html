<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的追蹤</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 首頁：分區的大按鈕，之後加新的追蹤商品只要在「商品開賣」區多放一張 .tile */
:root { --bg:#eef1f5; --card:#fff; --ink:#141a24; --muted:#5d6878; --line:#d5dbe4; --accent:#e07f00; --blue:#2b5fd9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f131a; --card:#181e28; --ink:#e8edf4; --muted:#95a1b3; --line:#2a3342; --accent:#ffb23f; --blue:#7ea2ff; color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#0f131a; --card:#181e28; --ink:#e8edf4; --muted:#95a1b3; --line:#2a3342; --accent:#ffb23f; --blue:#7ea2ff; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  padding:calc(24px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
main { max-width:560px; margin:0 auto; display:grid; gap:22px; }
h1 { font-size:24px; font-weight:900; margin:0; }
section { display:grid; gap:10px; }
h2 { font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--muted); margin:0; }
.tile { display:grid; grid-template-columns:52px 1fr auto; gap:14px; align-items:center; padding:14px 16px; background:var(--card);
  border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; }
.tile:active { transform:scale(.99); }
.ic { width:52px; height:52px; border-radius:12px; display:grid; place-items:center; font-size:28px; background:var(--bg); }
.tile b { display:block; font-size:17px; }
.tile small { color:var(--muted); font-size:13px; }
.arrow { color:var(--muted); font-size:22px; }
.goods .tile { border-left:4px solid var(--accent); }
.life .tile { border-left:4px solid var(--blue); }
.study .tile { border-left:4px solid #8e4ec6; }
.study .ic { font-family:"Noto Sans JP","Hiragino Sans",sans-serif; font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>我的追蹤</h1>

  <section class="goods" aria-label="商品開賣">
    <h2>商品開賣</h2>
    <a class="tile" href="funbox.html">
      <span class="ic">🌀</span>
      <span><b>戰鬥陀螺</b><small>FUNBOX · MOMO 開賣行程、官網庫存</small></span>
      <span class="arrow">›</span>
    </a>
  </section>

  <section class="life" aria-label="生活">
    <h2>生活</h2>
    <a class="tile" href="traffic.html">
      <span class="ic">🚗</span>
      <span><b>國1 通勤路況</b><small>按「查詢路況」請家裡 NAS 抓即時資料</small></span>
      <span class="arrow">›</span>
    </a>
    <a class="tile" href="school.html">
      <span class="ic">🏫</span>
      <span><b>國中學區地圖</b><small>桃園區、蘆竹區 115 學年度 · 依里、鄰查學區</small></span>
      <span class="arrow">›</span>
    </a>
  </section>

  <section class="study" aria-label="學習">
    <h2>學習</h2>
    <a class="tile" href="kana.html">
      <span class="ic">あ</span>
      <span><b>50 音練習</b><small>平假名、片假名 · 看字、聽音選擇題，錯題會一直複習</small></span>
      <span class="arrow">›</span>
    </a>
    <a class="tile" href="jp.html">
      <span class="ic">日</span>
      <span><b>日文課練習</b><small>配合大家學標準日本語 · 單字、句型、聽力、動手玩，錯題複習</small></span>
      <span class="arrow">›</span>
    </a>
  </section>
</main>
</body>
</html>

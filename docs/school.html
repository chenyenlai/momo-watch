<style>
/* Layout: full-height split — a reading panel (lookup, village detail, school legend) beside a vector map; stacks map-over-panel on phones. */
:root {
  --bg: #eef2f4;
  --panel: #fbfcfd;
  --fg: #18222c;
  --muted: #5a6875;
  --line: #d3dbe1;
  --accent: #155e75;
  --land: #e4eaee;
  --road: #ffffff;
  --road-casing: #b9c4cc;
  --label: #18222c;
  --halo: rgba(251,252,253,.9);
  --warn: #9a3412;
  --f-display: "LXGW WenKai TC", "Noto Serif TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161b; --panel: #161e25; --fg: #e2e8ed; --muted: #95a3b0; --line: #2a3640;
    --accent: #5fb4cf; --land: #1b242c; --road: #3a4651; --road-casing: #0f1419;
    --label: #e2e8ed; --halo: rgba(16,22,27,.85); --warn: #f0a070; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161b; --panel: #161e25; --fg: #e2e8ed; --muted: #95a3b0; --line: #2a3640;
  --accent: #5fb4cf; --land: #1b242c; --road: #3a4651; --road-casing: #0f1419;
  --label: #e2e8ed; --halo: rgba(16,22,27,.85); --warn: #f0a070; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.app { height: 100%; display: grid; grid-template-columns: minmax(340px, 400px) 1fr; }
.panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; padding-block: 20px 28px;
  display: flex; flex-direction: column; gap: 22px; }
#map { height: 100%; background: var(--land); min-width: 0; }

header h1 { font-family: var(--f-display); font-size: 1.75rem; line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: .02em; }
header .sub { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
.tabs { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: .85rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--fg); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }

h2 { font-size: .75rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin: 0 0 10px; }
section { min-width: 0; }

.lookup { display: grid; grid-template-columns: 1fr 1.3fr 5.5em; gap: 8px; }
.lookup label { display: flex; flex-direction: column; gap: 3px; font-size: .75rem; color: var(--muted); min-width: 0; }
.lookup select, .lookup input { font: inherit; font-size: .95rem; padding: 7px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; width: 100%; }
.lookup input { font-family: var(--f-mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.answer { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.answer .q { font-size: .8rem; color: var(--muted); }
.answer .res { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.answer .none { color: var(--warn); font-size: .9rem; }

.school-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }
.tag { font-size: .7rem; font-weight: 500; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--fg); color: var(--fg); white-space: nowrap; }
.cond { font-size: .8rem; color: var(--muted); }

.vhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vhead .name { font-family: var(--f-display); font-size: 1.45rem; }
.vhead .town { color: var(--muted); font-size: .85rem; }
.kind { font-size: .75rem; padding: 1px 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; margin: 12px 0; }
.lin { font-family: var(--f-mono); font-size: .8rem; text-align: center; padding: 5px 0; border-radius: 4px; color: #10161b;
  border: 1px solid transparent; position: relative; cursor: default; }
.lin.free { border: 1.5px dashed #10161b; }
.lin.cond::after { content: "*"; position: absolute; top: -2px; right: 3px; font-size: .8rem; }
.lin.unknown { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); }
.assign { display: flex; flex-direction: column; gap: 10px; }
.assign .row { display: flex; flex-direction: column; gap: 2px; }
.assign .lins { font-size: .85rem; font-family: var(--f-body); color: var(--fg); overflow-wrap: anywhere; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }

.schools { display: flex; flex-direction: column; gap: 2px; }
.schools button { all: unset; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; padding: 6px 8px;
  border-radius: 6px; cursor: pointer; }
.schools button:hover { background: var(--bg); }
.schools button:focus-visible { outline: 2px solid var(--accent); }
.schools button[aria-pressed="true"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
.schools .meta { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; }
.legend div { display: flex; gap: 10px; align-items: center; }
.legend svg { flex: none; }
details summary { cursor: pointer; font-size: .85rem; color: var(--accent); }
details ul { padding-left: 1.2em; margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
footer { font-size: .75rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
footer a { color: var(--accent); }

/* map */
.leaflet-container { background: var(--land); font-family: var(--f-body); }
.road { stroke: var(--road); fill: none; pointer-events: none; }
.road-casing { stroke: var(--road-casing); fill: none; pointer-events: none; }
.vill { cursor: pointer; transition: fill-opacity .15s; }
.vlabel { background: none; border: 0; box-shadow: none; padding: 0; font-size: 11px; color: var(--label); font-weight: 500;
  text-shadow: 0 0 3px var(--halo), 0 0 3px var(--halo), 0 0 2px var(--halo); white-space: nowrap; }
.vlabel::before { display: none; }
.slabel { background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: none; font-weight: 700; font-size: 12px; padding: 1px 6px; }
.slabel::before { display: none; }
.hide-labels .vlabel { display: none; }
.leaflet-control-zoom a { background: var(--panel); color: var(--fg); border-color: var(--line); }
.leaflet-control-attribution { background: var(--halo) !important; color: var(--muted); font-size: 10px; }
.leaflet-control-attribution a { color: var(--accent); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52vh auto; height: auto; }
  #map { order: -1; height: 52vh; }
  .panel { border-right: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .lookup { grid-template-columns: 1fr 1fr; }
  .lookup label:last-child { grid-column: span 2; }
}
@media (prefers-reduced-motion: reduce) { .vill { transition: none; } }

// 17 distinguishable hues, mid lightness so dark text on chips stays legible
const PALETTE = ['#3f7fbf','#d0803a','#4f9d5b','#c4525e','#8a6cc2','#2fa3a0','#c9a227','#a8607e','#6d8f2a','#5e72d6',
                 '#d06a9b','#3b9bd3','#b5713f','#7aa86b','#9a7fd1','#cf5f3c','#4a8f86'];
const COLOR = {};
DATA.schools.forEach((s, i) => COLOR[s.school] = PALETTE[i % PALETTE.length]);
const schoolInfo = Object.fromEntries(DATA.schools.map(s => [s.school, s]));

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const chip = name => `<span class="school-chip"><span class="sw" style="background:${COLOR[name]}"></span>${esc(name)}</span>`;

// ---------- 鄰 resolution ----------
function resolve(props, n) {
  const hits = [];
  for (const a of props.assign) {
    if (!a.nums) { hits.push({ school: a.school, free: a.free, cond: null, whole: true }); continue; }
    for (const x of a.nums) if (x.n === n) hits.push({ school: a.school, free: a.free, cond: x.cond || null });
  }
  // de-dup (same school may appear twice, e.g. 莊敬 10-11 listed in two schools' rows)
  const seen = new Set();
  return hits.filter(h => { const k = h.school + '|' + h.free + '|' + h.cond; if (seen.has(k)) return false; seen.add(k); return true; });
}
function maxLin(props) {
  let m = 0;
  for (const a of props.assign) if (a.nums) for (const x of a.nums) m = Math.max(m, x.n);
  return m;
}
function chipBg(hits) {
  const cs = [...new Set(hits.map(h => COLOR[h.school]))];
  if (cs.length === 1) return cs[0];
  const step = 100 / cs.length;
  return `linear-gradient(135deg, ${cs.map((c, i) => `${c} ${i * step}% ${(i + 1) * step}%`).join(', ')})`;
}

// ---------- map ----------
const map = L.map('map', { zoomControl: true, attributionControl: true, preferCanvas: false, minZoom: 11, maxZoom: 18 });
map.setView([25.02, 121.29], 12); // layers (and the SVG renderer's container) are only created once the map has a view
map.attributionControl.setPrefix(false).addAttribution('© OpenStreetMap 貢獻者');
const svgR = L.svg({ padding: 0.5 }).addTo(map);
const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
svgR._container.prepend(defs);
const patterns = {};
function patternFor(colors) {
  const key = colors.join(',');
  if (patterns[key]) return patterns[key];
  const id = 'p' + Object.keys(patterns).length;
  const w = 7, p = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
  p.setAttribute('id', id); p.setAttribute('patternUnits', 'userSpaceOnUse');
  p.setAttribute('width', w * colors.length); p.setAttribute('height', 10); p.setAttribute('patternTransform', 'rotate(45)');
  colors.forEach((c, i) => {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', i * w); r.setAttribute('width', w); r.setAttribute('height', 10); r.setAttribute('fill', c);
    p.appendChild(r);
  });
  defs.appendChild(p);
  return (patterns[key] = `url(#${id})`);
}

const roadPane = map.createPane('roads'); roadPane.style.zIndex = 420; roadPane.style.pointerEvents = 'none';
const labelPane = map.createPane('vlabels'); labelPane.style.zIndex = 640; labelPane.style.pointerEvents = 'none';

let activeTown = null, selected = null, focusSchool = null;
const villLayers = [];

function baseStyle(layer) {
  const p = layer.feature.properties, path = layer._path;
  if (!path) return;
  const cols = p.schools.map(s => COLOR[s]);
  path.setAttribute('fill', cols.length === 1 ? cols[0] : patternFor(cols));
  let op = 0.55, stroke = 'var(--fg)', sw = 0.6, dash = p.kind === 'free' ? '4 3' : null, sop = 0.45;
  if (focusSchool) op = p.schools.includes(focusSchool) ? 0.8 : 0.08;
  if (activeTown && p.town !== activeTown) op = Math.min(op, 0.18);
  if (selected === layer) { sw = 3; sop = 1; }
  if (p.kind === 'free') { sw = Math.max(sw, 1.4); sop = Math.max(sop, .9); }
  path.setAttribute('fill-opacity', op);
  path.setAttribute('stroke', stroke);
  path.setAttribute('stroke-width', sw);
  path.setAttribute('stroke-opacity', sop);
  if (dash) path.setAttribute('stroke-dasharray', dash); else path.removeAttribute('stroke-dasharray');
}
function restyleAll() { villLayers.forEach(baseStyle); if (selected) selected.bringToFront(); }

const villGeo = L.geoJSON(DATA.villages, {
  renderer: svgR,
  style: { className: 'vill' },
  onEachFeature(f, layer) {
    villLayers.push(layer);
    layer.on('click', () => selectVillage(layer, true));
    const c = turfCenter(f.geometry);
    L.tooltip({ permanent: true, direction: 'center', className: 'vlabel', pane: 'vlabels', interactive: false })
      .setLatLng(c).setContent(f.properties.v).addTo(map);
  }
}).addTo(map);

// label point: centroid of largest ring's bbox-weighted vertices (good enough for 里 shapes)
function turfCenter(g) {
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  let best = null, bestA = -1;
  for (const poly of polys) {
    const ring = poly[0]; let a = 0, cx = 0, cy = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
      a += f; cx += (ring[j][0] + ring[i][0]) * f; cy += (ring[j][1] + ring[i][1]) * f;
    }
    if (Math.abs(a) > bestA) { bestA = Math.abs(a); best = [cy / (3 * a), cx / (3 * a)]; }
  }
  return best;
}

const roadStyle = (casing) => f => ({

for (const s of DATA.schools) {

const towns = DATA.towns;
function fitTown(t) {
  const ls = villLayers.filter(l => !t || l.feature.properties.town === t);
  map.fitBounds(L.featureGroup(ls).getBounds(), { padding: [16, 16] });
}
const tabs = $('#tabs');
[['全部', null], ...towns.map(t => [t, t])].forEach(([label, t]) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
  b.setAttribute('aria-pressed', String(t === activeTown));
  b.onclick = () => { activeTown = t; tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); restyleAll(); fitTown(t); renderSchools(); };
  tabs.appendChild(b);
});

function renderSchools() {
  const box = $('#schools'); box.innerHTML = '';
  const counts = {};
  villLayers.forEach(l => l.feature.properties.schools.forEach(s => counts[s] = (counts[s] || 0) + 1));
  DATA.schools.filter(s => !activeTown || villLayers.some(l => l.feature.properties.town === activeTown && l.feature.properties.schools.includes(s.school)))
    .forEach(s => {
      const b = document.createElement('button'); b.type = 'button';
      b.setAttribute('aria-pressed', String(focusSchool === s.school));
      b.innerHTML = `<span class="sw" style="background:${COLOR[s.school]}"></span><span>${esc(s.school)}<span class="meta">　${esc(s.town)}</span></span><span class="meta">${counts[s.school] || 0} 里</span>`;
      b.onclick = () => toggleSchool(s.school);
      box.appendChild(b);
    });
}
function toggleSchool(name) {
  focusSchool = focusSchool === name ? null : name;
  restyleAll(); renderSchools();
  if (focusSchool) {
    const ls = villLayers.filter(l => l.feature.properties.schools.includes(name));
    const b = L.featureGroup(ls).getBounds().extend(schoolMarkers[name].getLatLng());
    map.fitBounds(b, { padding: [24, 24], maxZoom: 15 });
  }
}

function kindLabel(k) { return { single: '全里同一國中', split: '依鄰分屬', free: '含自由學區' }[k] || ''; }

function selectVillage(layer, fromMap) {
  selected = layer; restyleAll();
  const p = layer.feature.properties;
  const box = $('#vill');
  const max = maxLin(p);
  let grid = '';
  if (max > 0) {
    const cells = [];
    for (let n = 1; n <= max; n++) {
      const hits = resolve(p, n);
      if (!hits.length) { cells.push(`<div class="lin unknown" title="${n} 鄰：學區表未列出">${n}</div>`); continue; }
      const free = hits.some(h => h.free), cond = hits.some(h => h.cond);
      const title = `${n} 鄰：` + hits.map(h => h.school + (h.free ? '（自由學區）' : '') + (h.cond ? `【${h.cond}】` : '')).join('、');
      cells.push(`<div class="lin${free ? ' free' : ''}${cond ? ' cond' : ''}" style="background:${chipBg(hits)}" title="${esc(title)}">${n}</div>`);
    }
    grid = `<div class="grid" aria-label="各鄰學區">${cells.join('')}</div>`;
  }
  // group rows by school
  const bySchool = {};
  for (const a of p.assign) (bySchool[a.school] ||= []).push(a);
  const rows = Object.entries(bySchool).map(([s, list]) => {
    const parts = list.map(a => `${a.lin ? esc(a.lin) + ' 鄰' : '全里'}${a.free ? ' <span class="tag">◎ 自由學區</span>' : ''}`);
    const where = schoolInfo[s] && schoolInfo[s].town !== p.town ? `<span class="meta cond">（位於${esc(schoolInfo[s].town)}）</span>` : '';
    return `<div class="row">${chip(s)}${where}<div class="lins">${[...new Set(parts)].join('；')}</div></div>`;
  }).join('');
  box.innerHTML = `
    <div class="vhead"><span class="name">${esc(p.v)}里</span><span class="town">${esc(p.town)}</span><span class="kind">${kindLabel(p.kind)}</span></div>
    ${grid}
    <div class="assign">${rows}</div>
    ${max > 0 ? '<p class="hint" style="margin-top:10px">格子上的數字是鄰；斜色表示該鄰可讀兩校以上，虛線框為自由學區，* 表示該鄰再以街道或門牌劃分，請看上方原文。</p>' : ''}`;
  // sync lookup
  $('#q-town').value = p.town; fillVills(); $('#q-vill').value = p.v;
  if (fromMap) { $('#q-lin').value = ''; $('#answer').hidden = true; }
  if (!fromMap) map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 16 });
  if (fromMap && window.matchMedia('(max-width: 760px)').matches) $('#vill-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- lookup ----------
const qTown = $('#q-town'), qVill = $('#q-vill'), qLin = $('#q-lin');
towns.forEach(t => qTown.add(new Option(t, t)));
function fillVills() {
  const t = qTown.value;
  const vs = villLayers.map(l => l.feature.properties).filter(p => p.town === t).map(p => p.v).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
  qVill.innerHTML = '<option value="">選擇里</option>' + vs.map(v => `<option value="${esc(v)}">${esc(v)}里</option>`).join('');
}
fillVills();
function layerOf(t, v) { return villLayers.find(l => l.feature.properties.town === t && l.feature.properties.v === v); }
function runLookup() {
  const ans = $('#answer');
  const layer = layerOf(qTown.value, qVill.value);
  if (!layer) { ans.hidden = true; return; }
  const p = layer.feature.properties;
  const n = parseInt(qLin.value, 10);
  if (!qLin.value.trim()) { ans.hidden = true; return; }
  if (!Number.isFinite(n) || n < 1) { ans.hidden = false; ans.innerHTML = '<div class="none">請輸入鄰的數字，例如 19。</div>'; return; }
  const hits = resolve(p, n);
  ans.hidden = false;
  if (!hits.length) {
    ans.innerHTML = `<div class="q">${esc(p.town)} ${esc(p.v)}里 ${n} 鄰</div><div class="none">學區表沒有列出這一鄰。可能是新編的鄰或鄰號輸入有誤，請洽區公所或教育局國中教育科確認。</div>`;
    return;
  }
  const many = new Set(hits.map(h => h.school)).size > 1;
  ans.innerHTML = `<div class="q">${esc(p.town)} ${esc(p.v)}里 ${n} 鄰${many ? '：以下學校擇一（或依街道劃分）' : ''}</div><div class="res">` +
    hits.map(h => `<div>${chip(h.school)} ${h.free ? '<span class="tag">◎ 自由學區</span>' : ''}${h.cond ? `<div class="cond">${esc(h.cond)}</div>` : ''}</div>`).join('') + '</div>';
}
qTown.onchange = () => { fillVills(); $('#answer').hidden = true; };
qVill.onchange = () => { const l = layerOf(qTown.value, qVill.value); if (l) selectVillage(l, false); runLookup(); };
qLin.oninput = runLookup;
$('#lookup').addEventListener('submit', e => { e.preventDefault(); runLookup(); });

// remarks
$('#remarks-body').innerHTML = towns.map(t => `<strong style="font-size:.85rem">${esc(t)}</strong><ul>${(DATA.remarks[t] || []).map(r => `<li>${esc(r)}</li>`).join('')}</ul>`).join('');

renderSchools();
fitTown(null);
// open on a realistic example: 福林里 19 鄰 (split by 建新街 單雙號)
const ex = layerOf('桃園區', '福林');
if (ex) { selectVillage(ex, true); qLin.value = '19'; runLookup(); }
</script>

</body>
